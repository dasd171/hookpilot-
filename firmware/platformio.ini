; HookPilot ESP32 target - PROVISIONAL. This configuration has NOT been compiled or flashed:
; no PlatformIO toolchain was available where this firmware was written. Expect fixes on first build.
;
;   pio run -e esp32dev            build
;   pio run -e esp32dev -t upload  flash
;   pio device monitor -b 115200   JSON event lines + '#' logs
;
; Layout: include/ (hardware-independent core headers), src/core (core), src/hw (ESP32 drivers,
; guarded by ARDUINO/ESP32), src/main_esp32.cpp. host/ and test_host/ are host-only (Makefile).

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
; The core needs C++17 (std::map/std::function/<charconv> fallback). Arduino-ESP32 2.x defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I include
    -I src
    -DHOOKPILOT_TARGET_ESP32=1
build_src_filter = +<*> -<.git/>
